name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            cc: gcc
            cxx: g++
          - os: windows-latest
            c_compiler: 'C:/mingw64-gcc16/bin/gcc.exe'
            cpp_compiler: 'C:/mingw64-gcc16/bin/g++.exe'
            cc: 'C:/mingw64-gcc16/bin/gcc.exe'
            cxx: 'C:/mingw64-gcc16/bin/g++.exe'

    steps:
    - uses: actions/checkout@v4

    # cache-apt-pkgs-action's add-repository runs too late for package
    # resolution, so register the PPA (and refresh indexes) first.
    - name: Add ubuntu-toolchain-r PPA on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update

    - name: Cache and install gcc-16 on Linux
      if: matrix.os == 'ubuntu-latest'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: gcc-16 g++-16
        version: gcc16-1.0

    - name: Switch default gcc/g++ to 16 on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16
        sudo update-alternatives --set gcc /usr/bin/gcc-16
        gcc --version
        g++ --version

    - name: Cache MinGW-w64 GCC 16 on Windows
      if: matrix.os == 'windows-latest'
      id: cache-mingw
      uses: actions/cache@v4
      with:
        path: C:\mingw64-gcc16
        key: mingw64-gcc16-16.1.0-rt_v14-rev1-posix-seh-ucrt

    - name: Install MinGW-w64 GCC 16 (niXman mingw-builds) on Windows
      if: matrix.os == 'windows-latest' && steps.cache-mingw.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/16.1.0-rt_v14-rev1/x86_64-16.1.0-release-posix-seh-ucrt-rt_v14-rev1.7z'
        $zip = "$env:TEMP\mingw64.7z"
        $scratch = 'C:\mingw64-scratch'
        $toolchain = 'C:\mingw64-gcc16'
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
        Write-Host "Extracting toolchain to $scratch"
        if (Test-Path $scratch) { Remove-Item -Recurse -Force $scratch }
        New-Item -ItemType Directory -Path $scratch | Out-Null
        # Use forward-slash style output path; 7z requires the trailing slash to
        # treat it as a directory rather than a prefix.
        & 7z.exe x $zip "-o${scratch}\" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }
        Write-Host 'Contents of scratch directory:'
        Get-ChildItem -Path $scratch -Force | Select-Object Name, FullName | Format-Table -AutoSize | Out-String | Write-Host
        # The archive's top-level folder is the build name; rename it to a stable path.
        $extracted = Get-ChildItem -Path $scratch -Directory |
          Select-Object -First 1
        if (-not $extracted) { throw "No directory found under $scratch after 7z extraction" }
        if (Test-Path $toolchain) { Remove-Item -Recurse -Force $toolchain }
        Rename-Item -Path $extracted.FullName -NewName 'mingw64-gcc16'
        # `Rename-Item` moves into the parent (i.e. $scratch), so move it up to C:\.
        Move-Item -Path (Join-Path $scratch 'mingw64-gcc16') -Destination $toolchain -Force
        Remove-Item -Recurse -Force $scratch
        $gcc = Join-Path $toolchain 'bin\gcc.exe'
        if (-not (Test-Path $gcc)) { throw "gcc.exe not found at $gcc" }
        & $gcc --version

    - name: Prepend MinGW GCC 16 to PATH on Windows
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $toolchain = 'C:\mingw64-gcc16'
        $gcc = Join-Path $toolchain 'bin\gcc.exe'
        if (-not (Test-Path $gcc)) { throw "gcc.exe not found at $gcc" }
        # Strip any preinstalled mingw64/msys64 entries from machine PATH so our
        # GCC 16 wins, and prepend our toolchain.
        $sysPath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
        $newSysPath = ($sysPath -split ';' | Where-Object { $_ -and ($_ -notmatch 'mingw64') -and ($_ -notmatch 'msys64') }) -join ';'
        $newSysPath = "$toolchain\bin;$newSysPath"
        [Environment]::SetEnvironmentVariable('Path', $newSysPath, 'Machine')
        $env:Path = $newSysPath
        & $gcc --version
        & (Join-Path $toolchain 'bin\g++.exe') --version

    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-Ninja-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'src/**', 'core/**', 'config/**', 'semantic/**', 'lsp/**', 'test/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-Ninja-

    - name: Configure CMake
      shell: bash
      run: >
        cmake -B "build"
        -G "Ninja"
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DHEIMDALL_BUILD_TESTS=ON
        -S "${{ github.workspace }}"

    - name: Build
      shell: bash
      run: |
        export PATH="/c/mingw64-gcc16/bin:$PATH"
        cmake --build "build" --config ${{ matrix.build_type }}

    - name: Test
      shell: bash
      working-directory: build
      run: |
        export PATH="/c/mingw64-gcc16/bin:$PATH"
        ctest --rerun-failed --output-on-failure --build-config ${{ matrix.build_type }}

    - name: Package Windows Release
      if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = "${{ github.ref_name }}"
        $version = $version.TrimStart('v')
        $outputDir = "release-windows-${version}"
        New-Item -ItemType Directory -Path $outputDir | Out-Null
        # Copy the built executables
        Copy-Item -Path "build\src\heimdall.exe" -Destination $outputDir -Force
        Copy-Item -Path "build\lsp\heimdall-lsp.exe" -Destination $outputDir -Force
        # Create zip archive
        Compress-Archive -Path "$outputDir\*" -DestinationPath "heimdall-windows-${version}.zip" -Force
        Write-Host "Created heimdall-windows-${version}.zip"

    - name: Package Linux Release
      if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v')
      run: |
        version="${{ github.ref_name }}"
        version="${version#v}"
        output_dir="release-linux-${version}"
        mkdir -p "$output_dir"
        # Copy the built executables
        cp "build/src/heimdall" "$output_dir/"
        cp "build/lsp/heimdall-lsp" "$output_dir/"
        # Create tar.gz archive
        tar -czf "heimdall-linux-${version}.tar.gz" -C "$output_dir" .
        echo "Created heimdall-linux-${version}.tar.gz"

    - name: Upload Release Assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          heimdall-windows-${{ github.ref_name }}.zip
          heimdall-linux-${{ github.ref_name }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}